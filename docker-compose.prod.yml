# Production stack — runs on the Contabo VPS.
#
# Bring up:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Update:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Images are pulled from GitHub Container Registry (built by GitHub Actions).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_REPO}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Inside the container the storage path is fixed; we bind-mount the host
      # path onto it so the backup script (running on the host) can see the
      # same files.
      DISK_STORAGE_PATH: /var/crm/docs
    volumes:
      - /var/crm/docs:/var/crm/docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations on every startup. Idempotent thanks to schema_migrations.
    command: ["/bin/sh", "-c", "node dist/db/migrate.js && node dist/server.js"]

  caddy:
    image: ghcr.io/${GHCR_REPO}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data        # certs live here — back this up!
      - caddy_config:/config
    depends_on:
      - backend

  # Daily DB backup runs via host cron — see deploy/scripts/backup.sh
  # and the bootstrap script which installs the cron entry.

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
